services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: camp
      POSTGRES_PASSWORD: camp
      POSTGRES_DB: camp
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camp -d camp"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://camp:camp@db:5432/camp
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
