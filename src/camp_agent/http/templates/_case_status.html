{% if reply %}<p data-reply>{{ reply }}</p>{% endif %}
<div hx-ext="sse" sse-connect="{{ case.link }}/events?seen={{ case.seen | urlencode }}">
  <div id="case-lines" sse-swap="status">{{ case.lines }}</div>
  <div id="case-actions" sse-swap="actions">{{ case.actions }}</div>
</div>
<p><a href="{{ case.link }}" data-case-link>Your case link</a></p>
