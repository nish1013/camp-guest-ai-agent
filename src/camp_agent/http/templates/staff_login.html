<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camp staff login</title>
</head>
<body>
  <h1>Staff login</h1>
  {% if error %}<p data-error>{{ error }}</p>{% endif %}
  <form method="post" action="/staff/login" id="login-form">
    <label for="user">User name</label>
    <input id="user" name="user" required maxlength="100" autocomplete="username">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required maxlength="200" autocomplete="current-password">
    <button type="submit">Log in</button>
  </form>
</body>
</html>
