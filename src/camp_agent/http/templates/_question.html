<form data-question hx-post="{{ case.link }}/answer" hx-target="#case">
  <p>{{ question.text }}</p>
  <input type="hidden" name="confirmation" value="{{ question.confirmation }}">
  <input type="hidden" name="subject" value="{{ question.subject }}">
  <button type="submit" name="answer" value="yes">Yes</button>
  <button type="submit" name="answer" value="no">No</button>
</form>
