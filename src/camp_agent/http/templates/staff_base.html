<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camp staff</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 60rem; padding: 1rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #ccc; padding: 0.4rem; text-align: left; vertical-align: top; }
    input, select, button { font-size: 1rem; }
    .overdue { color: #b00020; font-weight: bold; }
    .notice { background: #fff3cd; padding: 0.5rem; }
  </style>
</head>
<body>
  <nav>
    <a href="/staff/cases">Queue</a> | <a href="/staff/cases/parked">Parked</a>
    <form method="post" action="/staff/logout" style="display: inline"><button type="submit">Log out</button></form>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
